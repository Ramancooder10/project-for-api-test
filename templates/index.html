<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Search</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h2 {
            margin-bottom: 20px;
        }

        #searchForm {
            display: flex;
            gap: 10px;
            width: 500px;
        }

        #searchInput {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #results {
            margin-top: 25px;
            width: 500px;
        }

        .product {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .product h3 {
            margin-top: 0;
        }

        #addProductForm {
            display: flex;
            gap: 10px;
            width: 500px;
        }

        #productName,
        #productPrice {
            padding: 10px;
            font-size: 16px;
        }

        #productName {
            flex: 1;
        }

        #productPrice {
            width: 120px;
        }

        #addMessage {
            margin-top: 15px;
        }

    </style>

</head>


<body>

    <!-- ========================= -->
    <!-- SEARCH SECTION -->
    <!-- ========================= -->

    <h2>Search Products</h2>

    <form id="searchForm">

        <input
            type="search"
            id="searchInput"
            placeholder="Search product..."
            required
        >

        <button type="submit">
            Search
        </button>

    </form>


    <!-- Search results -->
    <div id="results"></div>


    <!-- ========================= -->
    <!-- ADD PRODUCT SECTION -->
    <!-- ========================= -->

    <h2>Add Product</h2>

    <form id="addProductForm">

        <input
            type="text"
            id="productName"
            placeholder="Product name"
            required
        >

        <input
            type="number"
            id="productPrice"
            placeholder="Product price"
            step="0.01"
            required
        >

        <button type="submit">
            Add
        </button>

    </form>


    <!-- Add product message -->
    <div id="addMessage"></div>


    <script>


        // ==================================================
        // SEARCH PRODUCT
        // ==================================================

        const searchForm = document.getElementById("searchForm");

        const searchInput = document.getElementById("searchInput");

        const results = document.getElementById("results");


        searchForm.addEventListener("submit", async function(event) {

            // Prevent page refresh
            event.preventDefault();


            // Get user input
            const searchValue = searchInput.value.trim();


            // Clear previous results
            results.innerHTML = "";


            if (searchValue === "") {

                results.innerHTML =
                    "<p>Please enter a product name.</p>";

                return;
            }


            try {

                // Send search request to Flask API
                const response = await fetch(
                    `/api/search?q=${encodeURIComponent(searchValue)}`
                );


                // Check response
                if (!response.ok) {

                    throw new Error("Search API failed");

                }


                // Convert JSON response
                const matchedProducts = await response.json();


                // Check if no products found
                if (matchedProducts.length === 0) {

                    results.innerHTML = `
                        <p>
                            No product found for "${searchValue}".
                        </p>
                    `;

                    return;
                }


                // Display products
                matchedProducts.forEach(function(product) {

                    const div = document.createElement("div");

                    div.className = "product";


                    div.innerHTML = `
                        <h3>${product.name}</h3>

                        <p>
                            <strong>ID:</strong>
                            ${product.id}
                        </p>

                        <p>
                            <strong>Price:</strong>
                            $${product.price}
                        </p>
                    `;


                    results.appendChild(div);

                });

            }


            catch (error) {

                console.error(error);

                results.innerHTML = `
                    <p>
                        Unable to connect to the Flask API.
                    </p>
                `;

            }

        });



        // ==================================================
        // ADD PRODUCT
        // ==================================================

        const addForm =
            document.getElementById("addProductForm");

        const productName =
            document.getElementById("productName");

        const productPrice =
            document.getElementById("productPrice");

        const addMessage =
            document.getElementById("addMessage");


        addForm.addEventListener("submit", async function(event) {

            // Prevent page refresh
            event.preventDefault();


            // Get values from input fields
            const name = productName.value.trim();

            const price = parseFloat(productPrice.value);


            // Check values
            if (name === "" || isNaN(price)) {

                addMessage.innerHTML =
                    "<p>Please enter valid product details.</p>";

                return;
            }


            try {

                // Send POST request to Flask
                const response = await fetch("/products", {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },

                    body: JSON.stringify({

                        name: name,

                        price: price

                    })

                });


                // Convert Flask response to JSON
                const data = await response.json();


                // Check if request failed
                if (!response.ok) {

                    throw new Error(
                        data.message || "Failed to add product"
                    );

                }


                // Show success message
                addMessage.innerHTML = `

                    <p>
                        Product added successfully!
                    </p>

                    <p>
                        <strong>Name:</strong>
                        ${data.product.name}
                    </p>

                    <p>
                        <strong>Price:</strong>
                        $${data.product.price}
                    </p>

                `;


                // Clear input fields
                productName.value = "";

                productPrice.value = "";


            }


            catch (error) {

                console.error(error);

                addMessage.innerHTML =
                    "<p>Unable to add product.</p>";

            }

        });


    </script>

</body>

</html>
